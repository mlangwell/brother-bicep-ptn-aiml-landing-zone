# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: azure-ai-lz
metadata:
  template: azure-ai-lz
# 1.23.4 carries JSON arrays through ${VAR} substitution into array parameters
# (azure-dev#6694); 1.25.5 lets azd down purge Foundry accounts (azure-dev#8493).
requiredVersions:
  azd: ">= 1.25.5"
infra:
  provider: bicep
  path: .
  module: main
hooks:
  preprovision:
    posix:
      shell: pwsh
      run: ./scripts/Invoke-PreflightChecks.ps1
      continueOnError: false
      interactive: true
    windows:
      shell: pwsh
      run: ./scripts/Invoke-PreflightChecks.ps1
      continueOnError: false
      interactive: true
  # Post-deployment governance. Dry run by default and a no-op when
  # scripts/guardrails/.env is absent, so it can never fail a provision that
  # succeeded; continueOnError keeps a governance finding advisory rather than
  # fatal. Set GUARDRAILS_AUTO_APPLY=true in the azd environment to apply.
  postprovision:
    posix:
      shell: pwsh
      run: ./scripts/guardrails/Invoke-GuardrailsAzdHook.ps1
      continueOnError: true
      interactive: false
    windows:
      shell: pwsh
      run: ./scripts/guardrails/Invoke-GuardrailsAzdHook.ps1
      continueOnError: true
      interactive: false